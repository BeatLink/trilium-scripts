<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="{{CSS}}">
</head>
<body>
{{BODY}}
<footer><p>Generated from <a href="{{REPO}}" target="_blank">BeatLink/trilium-scripts</a></p></footer>
<script>
  // Only pull in mermaid when the page actually contains a diagram. The build is
  // vendored alongside the site (same file TAM ships), so the catalog stays
  // self-contained with no runtime CDN dependency.
  if (document.querySelector('pre.mermaid')) {
    var s = document.createElement('script');
    s.src = '{{MERMAID}}';
    s.onload = function () {
      var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      window.mermaid.initialize({ startOnLoad: true, theme: dark ? 'dark' : 'neutral', securityLevel: 'strict' });
    };
    s.onerror = function () { console.error('mermaid failed to load'); };
    document.head.appendChild(s);
  }
</script>
</body>
</html>
