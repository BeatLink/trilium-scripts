<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="{{CSS}}">
</head>
<body>
{{BODY}}
<footer><p>Generated from <a href="{{REPO}}" target="_blank">BeatLink/trilium-scripts</a></p></footer>
<script type="module">
  // Only pull in mermaid when the page actually contains a diagram.
  if (document.querySelector('pre.mermaid')) {
    import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs')
      .then(({ default: mermaid }) => {
        const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        mermaid.initialize({ startOnLoad: true, theme: dark ? 'dark' : 'neutral', securityLevel: 'strict' });
      })
      .catch(e => console.error('mermaid failed to load', e));
  }
</script>
</body>
</html>
