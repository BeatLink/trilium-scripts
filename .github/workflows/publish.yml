name: Publish Addons and Metadata

on:
  push:
    branches:
      - main       # Upload artifacts on every commit to main
    tags:
      - "v*.*.*"   # Publish a release on version tags
  workflow_dispatch:

jobs:
  publish-addons:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to create/update releases
    steps:
      - uses: actions/checkout@v4

      # publish.py uses only stdlib — no packages to install
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run merge + zip script
        run: python .github/workflows/publish.py

      # Always upload artifacts so commits can be tested without a tag
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: addon-artifacts
          path: |
            *.zip
            metadata.json

      # Only publish a GitHub Release when a version tag is pushed
      - name: Upload release assets
        uses: softprops/action-gh-release@v2.5.0
        if: github.ref_type == 'tag'
        with:
          files: |
            *.zip
            metadata.json
