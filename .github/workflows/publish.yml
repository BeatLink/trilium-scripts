name: Publish Addons

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history and tags: the changelogs are derived from it, and the release
      # notes diff this push against the commit the last publish tagged.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate
        run: node resources/scripts/tamhelper.js validate

      - name: Check changelogs
        run: node resources/scripts/tamhelper.js changelog --check

      - name: Build addon ZIPs
        run: node resources/scripts/tamhelper.js tam-to-zip --all

      # The catalog is otherwise only ever deployed to Pages, whose URL does not
      # survive a repository move. Attaching it here gives it one that does.
      - name: Build catalog
        run: |
          node resources/scripts/tamhelper.js publish
          cp resources/docs/catalog.json .

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node resources/scripts/tamhelper.js publish-release
