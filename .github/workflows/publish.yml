name: Publish Addons

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate
        run: python resources/scripts/tamhelper.py validate

      - name: Build addon ZIPs
        run: python resources/scripts/tamhelper.py tam-to-zip --all

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python resources/scripts/tamhelper.py publish-release
