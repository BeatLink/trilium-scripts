name: Publish Addons

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate
        run: python resources/scripts/validate.py

      - name: Build distribution files
        run: python resources/scripts/publish.py

      - name: Build addon ZIPs
        run: python resources/scripts/build_addon_zips.py

      - name: Publish to latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python resources/scripts/publish_release.py
