name: Publish Addons

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate
        run: python scripts/validate.py

      - name: Build distribution files
        run: python scripts/publish.py

      - name: Publish to latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest \
            --title "Latest" \
            --notes "Auto-published from \`${{ github.sha }}\`" \
            --latest 2>/dev/null || true
          gh release upload latest *.json --clobber
